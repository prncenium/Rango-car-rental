name: Keep Render backend awake

on:
  schedule:
    # Every 10 minutes — Render's free tier spins down after ~15 min idle.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 https://rango-car-rental.onrender.com/api/health
